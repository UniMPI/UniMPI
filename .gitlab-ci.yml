# GitLab CI/CD Configuration for unimpi
# This file configures automated building and testing on GitLab

stages:
  - build
  - test
  - quality

variables:
  # CMake build directory
  BUILD_DIR: build
  # Number of MPI processes for testing
  MPI_PROCS: 4

# Cache build artifacts between jobs
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - ${BUILD_DIR}/

# Template for running on Linux with MPI
.linux_mpi_template: &linux_mpi
  tags:
    - linux
    - docker
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq cmake build-essential

# ============================================================================
# BUILD STAGE
# ============================================================================

build:openmpi:
  <<: *linux_mpi
  stage: build
  image: ubuntu:22.04
  variables:
    CC: mpicc
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq cmake build-essential openmpi-bin libopenmpi-dev
  script:
    - cmake -B ${BUILD_DIR} . -DUNIMPI_BUILD_TESTS=ON -DUNIMPI_BUILD_MPI_TESTS=ON -DUNIMPI_BUILD_BENCHMARKS=ON "-DMPIEXEC_PREFLAGS=--allow-run-as-root;--oversubscribe"
    - cmake --build ${BUILD_DIR} --parallel $(nproc)
  artifacts:
    paths:
      - ${BUILD_DIR}/
    expire_in: 1 hour

build:mpich:
  <<: *linux_mpi
  stage: build
  image: ubuntu:22.04
  variables:
    CC: mpicc
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq cmake build-essential mpich libmpich-dev
  script:
    - cmake -B ${BUILD_DIR} . -DUNIMPI_BUILD_TESTS=ON -DUNIMPI_BUILD_MPI_TESTS=ON -DUNIMPI_BUILD_BENCHMARKS=ON
    - cmake --build ${BUILD_DIR} --parallel $(nproc)
  artifacts:
    paths:
      - ${BUILD_DIR}/
    expire_in: 1 hour

# ============================================================================
# TEST STAGE
# ============================================================================

test:openmpi:
  <<: *linux_mpi
  stage: test
  image: ubuntu:22.04
  needs:
    - build:openmpi
  variables:
    UNIMPI_BACKEND: openmpi
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq cmake openmpi-bin libopenmpi-dev
  script:
    - cd ${BUILD_DIR}
    - ctest --output-on-failure --parallel 4
  coverage: '/Total coverage: \d+%/'

test:mpich:
  <<: *linux_mpi
  stage: test
  image: ubuntu:22.04
  needs:
    - build:mpich
  variables:
    UNIMPI_BACKEND: mpich
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq cmake mpich libmpich-dev
  script:
    - cd ${BUILD_DIR}
    - ctest --output-on-failure --parallel 4

# Benchmark tests (run on successful tests)
benchmark:openmpi:
  <<: *linux_mpi
  stage: test
  image: ubuntu:22.04
  needs:
    - job: build:openmpi
      artifacts: true
    - job: test:openmpi
      artifacts: false
  variables:
    UNIMPI_BACKEND: openmpi
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq openmpi-bin libopenmpi-dev
  script:
    - cd ${BUILD_DIR}
    - echo "=== Running benchmarks ==="
    - mpirun --allow-run-as-root --oversubscribe -np 2 ./benchmarks/bench_latency --smoke --format csv
    - mpirun --allow-run-as-root --oversubscribe -np 4 ./benchmarks/bench_collective --smoke --format csv
    - mpirun --allow-run-as-root --oversubscribe -np 1 ./benchmarks/bench_overhead --smoke --format csv
  when: on_success

# ============================================================================
# QUALITY STAGE
# ============================================================================

code_style:
  stage: quality
  image: ubuntu:22.04
  script:
    - apt-get update -qq
    - apt-get install -y -qq clang-format
    - |
      # Check code formatting
      find src include tests -name "*.c" -o -name "*.h" | while read file; do
        clang-format -i "$file"
        if git diff --quiet "$file"; then
          echo "✓ $file is properly formatted"
        else
          echo "✗ $file needs formatting"
          git diff "$file"
          exit 1
        fi
      done
  allow_failure: true  # Don't block merge, just inform

# MPI version-gating truth tables + guards (anti-drift). Runs the gate's own
# self-test plus every reconcile subcommand so a gating regression never slips
# through silently. Stdlib-only Python, no MPI runtime needed.
version_gate:
  stage: quality
  image: ubuntu:22.04
  script:
    - python3 tools/test_gate.py
    - python3 tools/mpi_version_gate.py check --require-guards
    - python3 tools/mpi_version_gate.py mpi3
    - python3 tools/mpi_version_gate.py base

# Static analysis with cppcheck
static_analysis:
  stage: quality
  image: ubuntu:22.04
  script:
    - apt-get update -qq
    - apt-get install -y -qq cppcheck
    - cppcheck --enable=all --error-exitcode=0 \
        --suppress=missingIncludeSystem \
        --suppress=unusedFunction \
        --inline-suppr \
        src/ 2>&1 | tee cppcheck-report.txt
  artifacts:
    paths:
      - cppcheck-report.txt
    expire_in: 1 week
  allow_failure: true

# ============================================================================
# RELEASE STAGE (Manual)
# ============================================================================

# Only run on tags
release:
  stage: quality
  image: ubuntu:22.04
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - apt-get update -qq
    - apt-get install -y -qq cmake build-essential libopenmpi-dev
    - cmake -B ${BUILD_DIR} -DCMAKE_BUILD_TYPE=Release .
    - cmake --build ${BUILD_DIR} --parallel $(nproc)
    - cd ${BUILD_DIR}
    - ctest --output-on-failure
    - cmake --install . --prefix install
    - tar czf unimpi-${CI_COMMIT_TAG}-linux-x86_64.tar.gz install/
  artifacts:
    name: "unimpi-${CI_COMMIT_TAG}"
    paths:
      - ${BUILD_DIR}/unimpi-*.tar.gz
