name: CI

on:
  push:
    branches: [ main, dev, master ]
  pull_request:
    branches: [ main, dev, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-mpi:
    name: Linux ${{ matrix.backend }} ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: openmpi
            build_type: Debug
            packages: openmpi-bin libopenmpi-dev
          - backend: mpich
            build_type: Release
            packages: mpich libmpich-dev

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build tools and ${{ matrix.backend }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ninja-build ${{ matrix.packages }}

      - name: Resolve the matching launcher and library
        id: mpi
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ matrix.backend }}" == "openmpi" ]]; then
            launcher="$(command -v mpirun)"
            # Use pkg-config or mpicc to get library info
            libdir="$(pkg-config --variable=libdir ompi 2>/dev/null || mpicc --showme:libdir 2>/dev/null || echo "")"
            preflags="--oversubscribe"
          else
            launcher="$(command -v mpiexec)"
            # For MPICH, use pkg-config to get libdir
            libdir="$(pkg-config --variable=libdir mpich 2>/dev/null || \
                      pkg-config --variable=libdir mpich-gcc 2>/dev/null || echo "")"
            preflags=""
          fi

          test -x "$launcher"

          # Find libmpi.so in the library directory
          library=""
          if [[ -n "$libdir" ]]; then
            for candidate in "$libdir"/libmpi.so*; do
              if [[ -f "$candidate" && ! -L "$candidate" ]]; then
                library="$candidate"
                break
              elif [[ -f "$candidate" ]]; then
                # It's a symlink, resolve it
                library="$(readlink -f "$candidate")"
                break
              fi
            done
          fi

          # Fallback 1: Try common MPI installation paths
          if [[ -z "$library" ]]; then
            for common_path in /usr/lib /usr/local/lib /usr/lib/x86_64-linux-gnu /usr/lib/x86_64-linux-gnu/openmpi/lib /usr/lib/x86_64-linux-gnu/mpich/lib; do
              # Look for libmpi.so (not libmpich.so) to get the standard MPI interface
              if [[ -f "$common_path/libmpi.so" ]]; then
                library="$common_path/libmpi.so"
                break
              elif [[ -f "$common_path/libmpi.so.40" ]]; then
                library="$common_path/libmpi.so.40"
                break
              elif [[ -f "$common_path/libmpi.so.12" ]]; then
                library="$common_path/libmpi.so.12"
                break
              fi
            done
          fi

          # Fallback 2: use ldconfig as last resort
          if [[ -z "$library" ]]; then
            library_path="$(ldconfig -p 2>/dev/null | grep 'libmpi\.so' | head -1 | awk '{print $NF}' || echo "")"
            if [[ -n "$library_path" && -f "$library_path" ]]; then
              library="$(readlink -f "$library_path")"
            fi
          fi

          if [[ -z "$library" ]]; then
            echo "Could not find libmpi.so using any method" >&2
            echo "Debug info:" >&2
            echo "  libdir: ${libdir:-'(empty)'}" >&2
            echo "  mpicc --showme:libdir: $(mpicc --showme:libdir 2>/dev/null || echo 'N/A')" >&2
            echo "  ldconfig libmpi: $(ldconfig -p 2>/dev/null | grep libmpi | head -5 || echo 'N/A')" >&2
            exit 1
          fi

          library_dir="$(dirname "$library")"

          {
            echo "launcher=$launcher"
            echo "library=$library"
            echo "library_dir=$library_dir"
            echo "preflags=$preflags"
          } >> "$GITHUB_OUTPUT"

          "$launcher" --version
          echo "Runtime library: $library"

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_EXTENSIONS=OFF
          -DUNIMPI_BUILD_TESTS=ON
          -DUNIMPI_BUILD_MPI_TESTS=ON
          -DMPIEXEC_EXECUTABLE=${{ steps.mpi.outputs.launcher }}
          -DMPIEXEC_PREFLAGS=${{ steps.mpi.outputs.preflags }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test with real MPI
        env:
          LD_LIBRARY_PATH: ${{ steps.mpi.outputs.library_dir }}:${{ env.LD_LIBRARY_PATH }}
          UNIMPI_LIBRARY: ${{ steps.mpi.outputs.library }}
          UCX_TLS: ${{ matrix.backend == 'mpich' && 'tcp' || '' }}
          UCX_NET_IB_DEVICES: ${{ matrix.backend == 'mpich' && 'none' || '' }}
        run: ctest --test-dir build --output-on-failure --timeout 180

  linux-intelmpi:
    name: Linux Intel MPI Release
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Add the official Intel oneAPI repository
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gpg-agent ninja-build wget
          wget -qO- \
            https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg >/dev/null
          repository="deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg]"
          repository="$repository https://apt.repos.intel.com/oneapi all main"
          echo "$repository" | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update

      - name: Install Intel MPI
        run: >-
          sudo apt-get install --no-install-recommends -y
          intel-oneapi-mpi-devel

      - name: Resolve the Intel MPI runtime tuple
        id: mpi
        shell: bash
        run: |
          set -euo pipefail
          source /opt/intel/oneapi/mpi/latest/env/vars.sh
          prefix=/opt/intel/oneapi/mpi/latest
          launcher="$prefix/bin/mpiexec"
          library=""
          for candidate in \
            "$prefix/lib/libmpi.so" \
            "$prefix/lib/release/libmpi.so"; do
            if [[ -f "$candidate" ]]; then
              library="$(readlink -f "$candidate")"
              break
            fi
          done
          if [[ -z "$library" ]]; then
            echo "Could not resolve the Intel MPI runtime library" >&2
            exit 1
          fi
          launcher="$(readlink -f "$launcher")"
          test -x "$launcher"
          {
            echo "launcher=$launcher"
            echo "library=$library"
          } >> "$GITHUB_OUTPUT"
          echo "LD_LIBRARY_PATH=$(dirname "$library"):$prefix/lib" >> "$GITHUB_ENV"
          "$launcher" --version

      - name: Configure
        run: |
          source /opt/intel/oneapi/mpi/latest/env/vars.sh
          cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_EXTENSIONS=OFF \
          -DUNIMPI_BUILD_TESTS=ON \
          -DUNIMPI_BUILD_MPI_TESTS=ON \
          -DMPIEXEC_EXECUTABLE=${{ steps.mpi.outputs.launcher }} \
          "-DMPIEXEC_PREFLAGS=-bootstrap;fork"

      - name: Build
        run: cmake --build build --parallel

      - name: Test with real Intel MPI
        env:
          UNIMPI_LIBRARY: ${{ steps.mpi.outputs.library }}
        run: ctest --test-dir build --output-on-failure --timeout 180

  windows-msmpi:
    name: Windows x64 MS-MPI ${{ matrix.build_type }}
    runs-on: windows-2022
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Release
            shared: OFF

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the official MS-MPI runtime
        shell: pwsh
        run: |
          $uri = "https://download.microsoft.com/download/7/2/7/" + `
            "72731ebb-b63c-4170-ade7-836966263a8f/msmpisetup.exe"
          $installer = Join-Path $env:RUNNER_TEMP "msmpisetup.exe"
          $expected = "d09862be9fec0fe5377e2c472dd8c9aff9fbc2db7f2c1f488" + `
            "0a59ed64d51339bdfe3cd70af0f3443ba864bfedf42d684c943ba8c805774816c" + `
            "7760f70749d0f0"
          Invoke-WebRequest -Uri $uri -OutFile $installer
          $actual = (Get-FileHash $installer -Algorithm SHA512).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "MS-MPI installer checksum mismatch"
          }
          $process = Start-Process -FilePath $installer `
            -ArgumentList "-unattend", "-full", "-force" -Wait -PassThru
          if ($process.ExitCode -notin 0, 3010) {
            throw "MS-MPI installer failed with exit code $($process.ExitCode)"
          }

      - name: Configure the MS-MPI runtime
        shell: pwsh
        run: |
          $runtime = Join-Path $env:ProgramFiles "Microsoft MPI\Bin"
          $launcher = Join-Path $runtime "mpiexec.exe"
          $library = Join-Path $env:WINDIR "System32\msmpi.dll"
          if (!(Test-Path $launcher) -or !(Test-Path $library)) {
            throw "MS-MPI runtime installation is incomplete"
          }
          "UNIMPI_LIBRARY=$library" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DBUILD_SHARED_LIBS=OFF `
            -DUNIMPI_BUILD_TESTS=ON `
            -DUNIMPI_BUILD_MPI_TESTS=ON `
            "-DMPIEXEC_EXECUTABLE=$launcher"

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test with real MS-MPI
        run: >-
          ctest --test-dir build -C ${{ matrix.build_type }}
          --output-on-failure --timeout 180

  macos-mpi:
    name: macOS ${{ matrix.backend }} ${{ matrix.build_type }}
    runs-on: macos-14
    timeout-minutes: 35
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: openmpi
            formula: open-mpi
            launcher: mpirun
            build_type: Debug
            preflags: --oversubscribe
          - backend: mpich
            formula: mpich
            launcher: mpiexec
            build_type: Release
            preflags: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ${{ matrix.formula }} and Ninja
        run: |
          for formula in open-mpi mpich; do
            if brew list --formula "$formula" >/dev/null 2>&1; then
              brew unlink "$formula"
            fi
          done
          brew install ${{ matrix.formula }} ninja

      - name: Resolve the Homebrew runtime
        id: mpi
        shell: bash
        run: |
          set -euo pipefail
          prefix="$(brew --prefix ${{ matrix.formula }})"
          launcher="$prefix/bin/${{ matrix.launcher }}"
          library="$prefix/lib/libmpi.dylib"
          test -x "$launcher"
          test -f "$library"
          {
            echo "launcher=$launcher"
            echo "library=$library"
            echo "library_dir=$prefix/lib"
          } >> "$GITHUB_OUTPUT"
          "$launcher" --version
          echo "Runtime library: $library"

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_EXTENSIONS=OFF
          -DUNIMPI_BUILD_TESTS=ON
          -DUNIMPI_BUILD_MPI_TESTS=ON
          -DMPIEXEC_EXECUTABLE=${{ steps.mpi.outputs.launcher }}
          -DMPIEXEC_PREFLAGS=${{ matrix.preflags }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test with real MPI
        env:
          UNIMPI_LIBRARY: ${{ steps.mpi.outputs.library }}
        run: ctest --test-dir build --output-on-failure --timeout 180

  strict-c99-sanitizers:
    name: Linux strict C99 ASan, UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Clang and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang ninja-build

      - name: Configure strict instrumented build
        run: >-
          cmake -S . -B build-sanitized -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_C_EXTENSIONS=OFF
          -DCMAKE_C_FLAGS=-Werror\ -fsanitize=address,undefined\ -fno-omit-frame-pointer
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
          -DUNIMPI_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build-sanitized --parallel

      - name: Test under sanitizers
        run: >-
          ctest --test-dir build-sanitized
          --output-on-failure --timeout 180
